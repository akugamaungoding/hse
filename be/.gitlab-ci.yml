variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" 
  NUGET_PACKAGES: "${CI_PROJECT_DIR}/.nuget/packages"
  GIT_DEPTH: "0" 
  DOCKER_DRIVER: overlay2

stages:
  - build-sonar
  - docker-build-dev
  - deploy-dev

build-sonar:
  stage: build-sonar
  image: mcr.microsoft.com/dotnet/sdk:8.0
  tags:
    - gl-runner
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - "${NUGET_PACKAGES}"
      - sonar-scanner/
  script:
    - |
      if [ ! -f "sonar-scanner/dotnet-sonarscanner" ]; then
        dotnet tool install dotnet-sonarscanner --tool-path sonar-scanner
      fi
      export PATH="$PATH:$CI_PROJECT_DIR/sonar-scanner"

      dotnet sonarscanner begin \
        /k:"astradualsystem_hse-backend" \
        /v:"$CI_COMMIT_SHORT_SHA" \
        /d:sonar.token="$SONAR_TOKEN" \
        /d:"sonar.host.url=$SONAR_HOST_URL" \
        /d:sonar.exclusions=".gitlab-ci.yml,.gitlab-ci/**/*,*.gitlab-ci.yml,Dockerfile*,*.dockerfile,.dockerignore,docker-compose*.yml"

      dotnet build --no-incremental

      dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
        
docker-build-dev:
  stage: docker-build-dev
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - gl-runner
  when: on_success
  needs: ["build-sonar"]
  script:
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"$DOCKER_USERNAME\",\"password\":\"$DOCKER_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination=$DOCKER_IMAGE:$CI_COMMIT_SHA --destination=$DOCKER_IMAGE:dev
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-dev:
  stage: deploy-dev
  image: curlimages/curl:latest
  tags:
    - gl-runner
  when: on_success
  needs: ["docker-build-dev"]
  script:
    - curl -k --user "$JENKINS_USERNAME:$JENKINS_PWD" "$JENKINS_DEPLOY_URL/buildWithParameters?token=$JENKINS_TOKEN&IMAGE_TAG=$CI_COMMIT_BRANCH&IMAGE_NAME=$DOCKER_IMAGE&CONTAINER_NAME=hse-be-$CI_COMMIT_BRANCH&HOST_PORT=4500&CONTAINER_PORT=8080&DOCKER_NETWORK=sso-network&USE_DECRYPT_KEYS=true"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
